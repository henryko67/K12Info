<h1>Explorer</h1>
<section class="explorer">
  <header class="explorer-controls">
    <app-search-bar />
    <app-filter-panel />
  </header>

  <main
    class="explorer-content"
    [class.preview-open]="previewOpen()"
    [class.results-collapsed]="!resultsSidebarOpen()"
  >
    <app-map />

    @if (previewOpen()) {
      <app-school-preview />
    }

    <app-results-sidebar />
  </main>
</section>
