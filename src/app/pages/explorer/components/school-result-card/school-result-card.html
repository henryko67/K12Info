<button
  type="button"
  class="school-result-card"
  [class.selected]="selectedSchool()?._id === school()._id"
  (click)="onSelect()"
>
  <h3>{{ school().school_name }}</h3>

  <p>
    {{ school().address.location.city }},
    {{ school().address.location.state }}
  </p>

  <p>{{ school().sector }}</p>
</button>
