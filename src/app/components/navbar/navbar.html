<nav aria-label="Main navigation">
  <ul id="tabs">
    <li>
      <a routerLink="/">K12Info</a>
    </li>

    <li>
      <a routerLink="/">Explore</a>
    </li>

    <li>
      <a routerLink="/about">About</a>
    </li>

    <li class="theme-control">
      <button
        type="button"
        class="theme-toggle"
        [attr.aria-label]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="theme() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="toggleTheme()"
      >
        <span class="theme-icon" aria-hidden="true">
          {{ theme() === 'dark' ? '☀' : '☾' }}
        </span>
        <span class="theme-label">
          {{ theme() === 'dark' ? 'Light' : 'Dark' }}
        </span>
      </button>
    </li>
    <li class="auth-control">
      @if (!auth.isAuthenticated()) {
        <button
          type="button"
          (click)="openAuth()"
        >
          Log in
        </button>
      } @else {
        <button
          type="button"
          [attr.aria-expanded]="accountOpen()"
          (click)="toggleAccount()"
        >
          Account
        </button>

        @if (accountOpen()) {
          <div class="account-menu">
            <a
              routerLink="/settings"
              (click)="accountOpen.set(false)"
            >
              Settings
            </a>

            <button
              type="button"
              (click)="logout()"
            >
              Sign out
            </button>
          </div>
        }
      }
    </li>

    @if (authOpen() && !auth.isAuthenticated()) {
      <app-auth-modal (closed)="closeAuth()" />
    }
  </ul>
</nav>
